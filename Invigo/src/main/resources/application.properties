spring.application.name=Invigo
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:./Invigo/.env[.properties]

# Database Connection
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=Invigo;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Email / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:zacomputerftech@gmail.com}
spring.mail.password=${MAIL_PASSWORD:myechadpudvlszfh}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
spring.mail.properties.mail.smtp.quitwait=false

# JWT
jwt.secret=${JWT_SECRET:YTM0NZomIzI2NTsmIzI2NTsGRpbmdjb25jZXB0c2luY29kaW5nSW52aWdvRnJlc2hHdWFyZA==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ML API (Python FastAPI server)
# Change this URL here if the ML server moves to a different host or port.
# No Java recompilation needed.
ml.api.url=${ML_API_URL:http://127.0.0.1:8000}
ml.risk-threshold=${ML_RISK_THRESHOLD:0.4}
ml.alert-window-days=${ML_ALERT_WINDOW_DAYS:7}
ml.auto-scan.enabled=${ML_AUTO_SCAN_ENABLED:true}
ml.auto-scan.fixed-delay-ms=${ML_AUTO_SCAN_FIXED_DELAY_MS:300000}
ml.auto-scan.initial-delay-ms=${ML_AUTO_SCAN_INITIAL_DELAY_MS:60000}

# App settings
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.mail.from-address=${APP_MAIL_FROM_ADDRESS:no-reply@invigo.local}
app.mail.from-name=${APP_MAIL_FROM_NAME:Invigo FreshGuard}
